name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: write
      actions: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          additional_permissions: |
            pull_requests: write
            issues: write
            checks: write
            actions: read
          use_sticky_comment: true
          track_progress: true
          display_report: true
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      - name: Report Claude failure details
        if: failure() && steps.claude-review.outcome == 'failure'
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          output = Path(os.environ["RUNNER_TEMP"]) / "claude-execution-output.json"
          if not output.exists():
              print("Claude did not produce an execution result file.")
          else:
              raw = output.read_text()
              try:
                  payload = json.loads(raw)
                  messages = payload if isinstance(payload, list) else [payload]
              except json.JSONDecodeError:
                  messages = [json.loads(line) for line in raw.splitlines() if line.strip()]
              results = [message for message in messages
                         if isinstance(message, dict) and message.get("type") == "result"]
              # Report only final error fields, not prompts, tool payloads, or environment.
              for result in results:
                  print(json.dumps({key: result[key] for key in
                      ("subtype", "is_error", "result", "errors") if key in result}, indent=2))
              if not results:
                  print("Claude output contained no final result message.")
